<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas Assistants · Marketing UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css" />
<link rel="stylesheet" href="kit.css" />
</head>
<body>
<div id="root"></div>

<!-- React and Babel standalone load from unpkg (pinned, SRI-checked). This
     predates the brand migration; no other CDN is used. Fonts are local. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Brand.jsx"></script>
<script type="text/babel" src="NavBar.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="LogoBar.jsx"></script>
<script type="text/babel" src="Approach.jsx"></script>
<script type="text/babel" src="RoleSplit.jsx"></script>
<script type="text/babel" src="Proof.jsx"></script>
<script type="text/babel" src="Pricing.jsx"></script>
<script type="text/babel" src="FAQ.jsx"></script>
<script type="text/babel" src="CTAFooter.jsx"></script>

<script type="text/babel" data-presets="react">
  const App = () => {
    const [active, setActive] = React.useState(null);
    const [toast, setToast] = React.useState(null);

    const scrollTo = (id = "approach") => {
      setActive(id);
      const el = document.getElementById(id);
      if (el) window.scrollTo({ top: el.offsetTop - 72, behavior: "smooth" });
    };
    const onBook = () => {
      setToast("Placeholder: connect the booking link here.");
      setTimeout(() => setToast(null), 2400);
    };

    return (
      <React.Fragment>
        <NavBar active={active} onNav={scrollTo} onBook={onBook} />
        <main>
          <Hero onPrimary={onBook} onSecondary={(id) => scrollTo(typeof id === "string" ? id : "approach")} />
          <LogoBar />
          <Approach />
          <RoleSplit onNav={scrollTo} />
          <Proof />
          <Pricing onBook={onBook} />
          <FAQ />
          <CTABlock onPrimary={onBook} />
        </main>
        <Footer />
        {toast && <div className="toast" role="status">{toast}</div>}
      </React.Fragment>
    );
  };
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
